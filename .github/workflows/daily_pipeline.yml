name: Daily Phonk Radar Pipeline

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours — cost is low enough with the
    # new actor, and the dashboard's 3h cooldown means this can't be
    # pushed more frequent than that even with manual clicks too.

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect TikTok data
        run: python pipelines/collect_tiktok.py
      - name: Upsert videos/creators/sounds
        run: python pipelines/update_records.py
      - name: Compute daily rollups
        run: python pipelines/compute_daily_metrics.py
      - name: Compute trend scores
        run: python pipelines/compute_trend_scores.py
      - name: Generate fresh AI brief
        run: python ai/generate_weekly_insight.py
      - name: Notify on failure
        if: failure()
        run: echo "Pipeline failed — check logs"
